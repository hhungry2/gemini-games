<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wario 24ゲーム 描画検証</title>
    <style>
      *{box-sizing:border-box}body{margin:0;padding:20px;background:#0c1426;color:#fff7e3;font-family:Arial,'Yu Gothic UI',sans-serif}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px}h1{font-size:20px;margin:0}#status{font-size:13px;color:#9fdcd0}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}article{min-width:0;background:#192338;border:1px solid #fff7e326;border-radius:13px;overflow:hidden}h2{font-size:12px;margin:9px 12px}canvas{display:block;width:100%;height:auto;aspect-ratio:4/3}p{font-size:11px;color:#c9cbd4;margin:8px 12px 11px;line-height:1.6}@media(max-width:900px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}
    </style>
  </head>
  <body>
    <header><h1>Wario · 全24ゲームの描画検証</h1><span id="status">描画中…</span></header>
    <main id="gallery"></main>
    <script type="module" src="./wario-gallery.ts"></script>
  </body>
</html>
